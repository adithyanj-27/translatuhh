<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Translatuhh — Live Speech & Reel Subtitle Overlay</title>
    <meta name="theme-color" content="#080a0f">
    <link rel="manifest" href="/manifest.json">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
      // Apply theme immediately to avoid flash of light/dark mode
      const savedTheme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="watch-pane" aria-label="Shared video preview">
        <div class="topbar">
          <div>
            <p class="eyebrow">Live Speech & Reel Translator</p>
            <h1>Translatuhh</h1>
          </div>
          <div class="topbar-actions">
            <!-- PWA Install Button -->
            <button class="ghost-button pwa-install-btn" id="installPwaBtn" type="button" style="display: none;" title="Add Translatuhh to Home Screen">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Install App
            </button>

            <!-- API Status Badge -->
            <div class="api-badge" id="apiBadge" title="Checking API status...">
              <span class="badge-dot"></span>
              <span class="badge-text">Checking API...</span>
            </div>
            
            <!-- Live Capture Status -->
            <div class="status-pill" id="statusPill">
              <span class="status-dot"></span>
              Idle
            </div>

            <!-- Theme Toggle Button -->
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
              <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
              <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
          </div>
        </div>

        <div class="preview-frame">
          <video id="previewVideo" autoplay muted playsinline></video>
          <div class="empty-preview" id="emptyPreview">
            <div class="empty-preview-content">
              <svg class="preview-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              <span id="emptyPreviewText">Start capture to preview feed here.</span>
            </div>
          </div>
          <canvas id="audioMeter" width="720" height="96" aria-label="Audio level visualization"></canvas>
        </div>

        <div class="support-note" id="supportNote" hidden></div>

        <div class="controls" aria-label="Capture controls">
          <div class="control-row">
            <!-- Source Selector -->
            <label class="select-label" for="audioSource">
              Input Source
              <select id="audioSource">
                <option value="system">System Sound (Headphones Supported)</option>
                <option value="mic">Microphone (Speakers & Voice)</option>
              </select>
            </label>

            <!-- Target Language Selector -->
            <label class="select-label" for="targetLanguage">
              Translate to
              <select id="targetLanguage">
                <option>English</option>
                <option>Hindi</option>
                <option>Bengali</option>
                <option>Gujarati</option>
                <option>Kannada</option>
                <option>Malayalam</option>
                <option>Marathi</option>
                <option>Odia</option>
                <option>Punjabi</option>
                <option>Tamil</option>
                <option>Telugu</option>
                <option>Assamese</option>
                <option>Nepali</option>
                <option>Urdu</option>
                <option>Spanish</option>
                <option>French</option>
                <option>German</option>
                <option>Japanese</option>
              </select>
            </label>
          </div>

          <div class="action-row">
            <button class="primary-button" id="shareButton" type="button">
              <span class="play-icon" aria-hidden="true">▶</span>
              Start Capture
            </button>
            
            <button class="pip-button" id="pipButton" type="button" title="Pin subtitles floating over Instagram, YouTube or TikTok">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><rect x="13" y="11" width="7" height="7" rx="1"></rect></svg>
              Floating Subtitles (PiP)
            </button>

            <button class="icon-button" id="stopButton" type="button" aria-label="Stop capture" title="Stop capture" disabled>
              Stop
            </button>
          </div>
        </div>
      </section>

      <aside class="translation-pane" aria-label="Translated captions">
        <div class="pane-header">
          <div>
            <p class="eyebrow">Detected Language</p>
            <h2 id="detectedLanguage">Waiting</h2>
          </div>
          
          <div class="pane-controls">
            <!-- Font Sizing controls -->
            <div class="font-controls" title="Adjust text size">
              <button class="size-btn" id="fontSizeDec" type="button" aria-label="Decrease text size">A-</button>
              <span class="size-label">Size</span>
              <button class="size-btn" id="fontSizeInc" type="button" aria-label="Increase text size">A+</button>
            </div>

            <!-- Scroll Pause -->
            <label class="scroll-pause-label" title="Pause auto-scroll to read text">
              <input type="checkbox" id="pauseScroll">
              <span>Pause Scroll</span>
            </label>

            <!-- Action buttons -->
            <button class="ghost-button" id="exportButton" type="button" title="Download full transcript">Export</button>
            <button class="ghost-button" id="clearButton" type="button">Clear</button>
          </div>
        </div>

        <div class="caption-list" id="captionList" data-size="medium">
          <article class="caption-card muted">
            <p class="original">No captions yet.</p>
            <p class="translated">Select your audio source, click "Start Capture", and click "Floating Subtitles (PiP)" to view real-time captions pinned over reels and apps.</p>
          </article>
        </div>
      </aside>
    </main>

    <!-- Hidden elements driving the Picture-in-Picture Floating Subtitle Window -->
    <canvas id="pipCanvas" width="640" height="240" style="display: none;"></canvas>
    <video id="pipVideo" autoplay muted playsinline style="display: none;"></video>

    <script src="/app.js" type="module"></script>
  </body>
</html>
